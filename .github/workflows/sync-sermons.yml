name: Sync sermons and publish website
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [fix/preview-photo-paths]
    paths-ignore: ['README.md', '**/*.md']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: church-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/preview-photo-paths
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retain previous public sermon metadata if available
        run: |
          curl --fail --silent --show-error --max-time 30 https://familychurchofsandiego.org/sermons-data.json -o sermons-data.json || rm -f sermons-data.json
      - name: Refresh playlist metadata
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/sync-sermons.py
      - name: Prepare public website files
        run: |
          python scripts/prepare-pages.py
          mkdir -p _site
          cp index.html home-preview.html about.html sermons.html contact.html donate.html privacy.html newsletter-confirmed.html *.css site.js newsletter-config.js *.jpg *.png *.webp robots.txt sitemap.xml _site/
          cp -R about sermons contact donate privacy newsletter _site/
          if [ -f sermons-data.json ]; then cp sermons-data.json _site/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
